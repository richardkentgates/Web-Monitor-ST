<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WordPress Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>WordPress Monitor</h1>

<button id="notifBtn" onclick="enableNotifications()">Enable Notifications</button>

<div id="notifStatus" style="margin: 6px 0; color: var(--text-muted); font-size: 13px;">
  Notifications: <strong>Unknown</strong>
</div>

<div id="countdown">Next check in: 60s</div>

<input id="urlInput" type="url" placeholder="https://example.com" style="width:30%">
<input id="userInput" type="text" placeholder="Username" style="width:18%">
<input id="passInput" type="password" placeholder="App Password" style="width:18%">
<button onclick="addSite()">Add</button>

<button onclick="exportSites()">Export</button>
<button onclick="importSites()">Import</button>
<input id="importFile" type="file" accept="application/json" style="display:none">

<div id="sites"></div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="if(event.target===this)closeLightbox()">
  <div class="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <h2 id="lightboxTitle"></h2>
    <div class="detail-grid" id="lightboxContent"></div>
  </div>
</div>

<script src="monitor.js"></script>
</body>
</html>
